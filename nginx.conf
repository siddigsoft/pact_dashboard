# Nginx configuration for React SPA on VPS
# Place this in /etc/nginx/sites-available/your-site or include it in your main nginx.conf

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;  # Replace with your domain or IP
    
    # Root directory where your built files are located
    root /var/www/your-app/dist;  # Update this path to your actual dist folder
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve static assets with proper MIME types and caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico|json|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Ensure correct MIME types
        types {
            application/javascript js;
            text/css css;
        }
    }

    # Serve JS files from /js directory with correct MIME type
    location /js/ {
        alias /var/www/your-app/dist/js/;  # Update this path
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript";
        access_log off;
    }

    # Serve assets directory
    location /assets/ {
        alias /var/www/your-app/dist/assets/;  # Update this path
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Handle all other routes - SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Prevent caching of index.html
        if ($uri = '/index.html') {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Optional: Logging
    access_log /var/log/nginx/your-app-access.log;
    error_log /var/log/nginx/your-app-error.log;
}

