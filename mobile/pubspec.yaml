name: pact_command_center
description: PACT Command Center - Field Operations Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.2

  # Firebase / Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.3

  # Location / GPS
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Image / camera
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Signature (digital signing)
  signature: ^5.4.1

  # Network
  connectivity_plus: ^6.0.3
  dio: ^5.7.0

  # Charts
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  timeago: ^3.7.0
  uuid: ^4.5.0
  shimmer: ^3.0.0
  open_filex: ^4.5.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
