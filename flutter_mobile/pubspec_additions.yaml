# Add these dependencies to your existing pubspec.yaml
# Replace the jitsi_meet_flutter_sdk with flutter_webrtc

dependencies:
  # Remove this:
  # jitsi_meet_flutter_sdk: ^10.3.0
  
  # Add these for WebRTC calling:
  flutter_webrtc: ^0.12.7
  flutter_local_notifications: ^19.5.0
  vibration: ^2.1.0
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  
  # Fix record package version conflict (record_linux vs record_platform_interface):
  # Option 1: Pin to compatible versions
  record: ^5.1.2
  # Option 2: If you don't need audio recording, add to dependency_overrides:
  # dependency_overrides:
  #   record_linux: ^1.0.0

# Android Configuration (android/app/build.gradle.kts):
# Make sure you have:
#   compileSdk = 35
#   minSdk = 24
#   
# Add to android/app/src/main/AndroidManifest.xml inside <manifest>:
#   <uses-permission android:name="android.permission.CAMERA" />
#   <uses-permission android:name="android.permission.RECORD_AUDIO" />
#   <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
#   <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
#   <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
#   <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
#   <uses-permission android:name="android.permission.VIBRATE" />
#   <uses-permission android:name="android.permission.WAKE_LOCK" />
#   <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
#   <uses-permission android:name="android.permission.FOREGROUND_SERVICE_PHONE_CALL" />
#   <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
#   <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

# iOS Configuration (ios/Runner/Info.plist):
# Add these keys:
#   <key>NSMicrophoneUsageDescription</key>
#   <string>PACT needs microphone access for voice calls</string>
#   <key>NSCameraUsageDescription</key>
#   <string>PACT needs camera access for video calls</string>
#   <key>UIBackgroundModes</key>
#   <array>
#     <string>audio</string>
#     <string>voip</string>
#     <string>remote-notification</string>
#   </array>
