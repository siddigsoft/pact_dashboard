name: Deploy to VPS Production (TEST ONLY)

on:
  push:
    branches:
      - master_backup

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS (hardcoded creds — TEST)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 209.38.78.38
          username: deploy
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACCiuuDa9zYl5zmknsJpbAIPHByKUfpWuma+XFm/aj54OQAAAJDn+7H85/ux
            /AAAAAtzc2gtZWQyNTUxOQAAACCiuuDa9zYl5zmknsJpbAIPHByKUfpWuma+XFm/aj54OQ
            AAAECPMfc/1PwFqCYgv4VGK6QR4IFItzQXtzjMi6fvmgHWDKK64Nr3NiXnOaSewmlsAg8c
            HIpR+la6Zr5cWb9qPng5AAAACnZwcy1hY2Nlc3MBAgM=
            -----END OPENSSH PRIVATE KEY-----
          script: |
            set -e

            echo "🚀 Deploying PACT Frontend (static)"

            cd /home/deploy/pact_dashboard

            git fetch origin
            git reset --hard origin/master_backup
            git clean -fd

            npm install
            npm run build

            # Ensure Nginx can read files
            chown -R deploy:www-data dist
            find dist -type d -exec chmod 755 {} \;
            find dist -type f -exec chmod 644 {} \;

            echo "✅ Deployment complete — static files ready"
