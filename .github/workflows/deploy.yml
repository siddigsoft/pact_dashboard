name: Deploy to VPS Production (TEST KEY)

on:
  push:
    branches:
      - master_backup

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH (hardcoded key)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 209.38.78.38
          username: deploy
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACDsHZyp7Dh6a5/4HF5NES28DX+A/+6j5+cVPKRDckPGQwAAAJjD7cU1w+3F
            NQAAAAtzc2gtZWQyNTUxOQAAACDsHZyp7Dh6a5/4HF5NES28DX+A/+6j5+cVPKRDckPGQw
            AAAEC1vOU+lUWcM2NmT4hRzQZTI3rhDcQhthO9CUrk0lkkrewdnKnsOHprn/gcXk0RLbwN
            f4D/7qPn5xU8pENyQ8ZDAAAAE2dpdGh1Yi1hY3Rpb25zQHBhY3QBAg==
            -----END OPENSSH PRIVATE KEY-----
          script: |
            set -e

            echo "🚀 Deploying PACT Frontend (static)"

            cd /home/deploy/pact_dashboard

            # 🔑 CRITICAL FIX: Ensure 'deploy' owns all files before Git operations
            sudo chown -R deploy:deploy /home/deploy/pact_dashboard


            # Now safe to reset and clean
            git fetch origin
            git reset --hard origin/master_backup
            git clean -fd

            npm install
            npm run build

            # Set permissions for Nginx (www-data must read files)
            chown -R deploy:www-data dist
            find dist -type d -exec chmod 755 {} \;
            find dist -type f -exec chmod 644 {} \;

            echo "✅ Deployment completed successfully"