name: Deploy to VPS Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        # ponytail: pin npm to a version without the "Exit handler never called!" regression
        # (community-reported fix). If this still fails, the debug-log step below prints
        # the real internal npm trace so we stop guessing.
        run: |
          npm install -g npm@10.8.2
          npm --version
          npm install
          npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Dump npm debug log on failure
        if: failure()
        run: cat /home/runner/.npm/_logs/*-debug-0.log

      - name: Deploy dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 209.38.78.38
          username: deploy
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACDsHZyp7Dh6a5/4HF5NES28DX+A/+6j5+cVPKRDckPGQwAAAJjD7cU1w+3F
            NQAAAAtzc2gtZWQyNTUxOQAAACDsHZyp7Dh6a5/4HF5NES28DX+A/+6j5+cVPKRDckPGQw
            AAAEC1vOU+lUWcM2NmT4hRzQZTI3rhDcQhthO9CUrk0lkkrewdnKnsOHprn/gcXk0RLbwN
            f4D/7qPn5xU8pENyQ8ZDAAAAE2dpdGh1Yi1hY3Rpb25zQHBhY3QBAg==
            -----END OPENSSH PRIVATE KEY-----
          source: dist/
          target: /home/deploy/pact_dashboard/
          rm: true

      - name: Fix permissions on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 209.38.78.38
          username: deploy
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACDsHZyp7Dh6a5/4HF5NES28DX+A/+6j5+cVPKRDckPGQwAAAJjD7cU1w+3F
            NQAAAAtzc2gtZWQyNTUxOQAAACDsHZyp7Dh6a5/4HF5NES28DX+A/+6j5+cVPKRDckPGQw
            AAAEC1vOU+lUWcM2NmT4hRzQZTI3rhDcQhthO9CUrk0lkkrewdnKnsOHprn/gcXk0RLbwN
            f4D/7qPn5xU8pENyQ8ZDAAAAE2dpdGh1Yi1hY3Rpb25zQHBhY3QBAg==
            -----END OPENSSH PRIVATE KEY-----
          script: |
            find /home/deploy/pact_dashboard/dist -type d -exec chmod 755 {} \;
            find /home/deploy/pact_dashboard/dist -type f -exec chmod 644 {} \;