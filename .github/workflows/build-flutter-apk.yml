name: Build Flutter APK

on:
  push:
    branches: [master, main]
    paths: 
      - 'mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PACT Command Center APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Write local.properties
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          mkdir -p mobile/android
          printf "flutter.sdk=${FLUTTER_ROOT}\nsdk.dir=${ANDROID_SDK_ROOT}\nflutter.versionName=1.0.0\nflutter.versionCode=1\n" > mobile/android/local.properties
          echo "local.properties written:"
          cat mobile/android/local.properties

      - name: Bootstrap missing Android resources
        working-directory: mobile
        run: |
          flutter create \
            --project-name pact_command_center \
            --org com.pact \
            --android-language kotlin \
            --no-pub \
            . 2>/dev/null || true

      - name: Create google-services.json placeholder
        working-directory: mobile
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            printf '{"project_info":{"project_number":"000000000000","project_id":"pact-command-center","storage_bucket":"pact-command-center.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000","android_client_info":{"package_name":"com.pact.commandcenter"}},"api_key":[{"current_key":"PLACEHOLDER"}],"services":{}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
        
      - name: Patch app_links for CI compatibility
        run: |
          find ~/.pub-cache -name "build.gradle" -path "*/app_links*/android/build.gradle" | while read f; do
            echo "Patching: $f"
            sed -i 's/flutter\.compileSdkVersion/34/g' "$f"
            sed -i 's/flutter\.targetSdkVersion/34/g' "$f"
            sed -i 's/flutter\.minSdkVersion/21/g' "$f"
            sed -i "s/flutter\.ndkVersion/\"27.0.12077973\"/g" "$f"
            cat "$f"
          done
          
      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Rename APK
        working-directory: mobile
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/PACT-CommandCenter-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PACT-CommandCenter-v${{ github.run_number }}
          path: mobile/release/PACT-CommandCenter-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## PACT Command Center APK" >> $GITHUB_STEP_SUMMARY
          echo "| Build | v${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | 3.24.5 stable |" >> $GITHUB_STEP_SUMMARY
