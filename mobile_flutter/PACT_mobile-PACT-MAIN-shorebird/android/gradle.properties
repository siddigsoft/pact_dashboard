org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=true

# Suppress warning when using compileSdk 36 with older Android Gradle Plugin
android.suppressUnsupportedCompileSdk=36

# Performance optimizations
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.code.style=official

# Disable PNG crunching (saves time)
android.enablePngCruncher=false
