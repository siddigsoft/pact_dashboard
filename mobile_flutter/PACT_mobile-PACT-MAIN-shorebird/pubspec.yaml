  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mocktail: ^1.0.3
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.1
  flutter_launcher_icons: ^0.13.1
  test: ^1.24.9

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/pact_consultancy_pact_cover.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/pact_consultancy_pact_cover.jpg"
  web:
    generate: true
    image_path: "assets/images/pact_consultancy_pact_cover.jpg"
  windows:
    generate: true
    image_path: "assets/images/pact_consultancy_pact_cover.jpg"
  macos:
    generate: true
    image_path: "assets/images/pact_consultancy_pact_cover.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/pact_consultancy_pact_cover.jpg
    - assets/images/placeholders/
    - assets/icons/
    - assets/sounds/
    - shorebird.yaml
    - lib/l10n/
  generate: true
